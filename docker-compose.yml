services:
  kabhyan-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kabhyan_technologies_web
    restart: always
    ports:
      - "8080:80"
    environment:
      - NGINX_PORT=80
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
